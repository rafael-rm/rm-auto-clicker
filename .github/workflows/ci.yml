name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''
    outputs:
      artifact-name:
        value: ${{ jobs.windows.outputs.artifact-name }}
      commit-sha:
        value: ${{ jobs.windows.outputs.commit-sha }}
      package-sha256:
        value: ${{ jobs.windows.outputs.package-sha256 }}

permissions:
  contents: read

env:
  DOTNET_CLI_UI_LANGUAGE: en-US

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  windows:
    name: Windows build, tests and publish
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      artifact-name: release-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
      commit-sha: ${{ steps.source.outputs.commit-sha }}
      package-sha256: ${{ steps.publish.outputs.package-sha256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the checked-out commit
        id: source
        run: |
          $commit = git rev-parse --verify 'HEAD^{commit}'
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not identify the build commit.'
          }
          "commit-sha=$commit" >> $env:GITHUB_OUTPUT
      - name: Validate version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          $release = ./scripts/Get-Version.ps1 -Tag $env:RELEASE_TAG
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT
          if ($env:RELEASE_TAG) {
            git merge-base --is-ancestor HEAD refs/remotes/origin/master
            if ($LASTEXITCODE -ne 0) {
              throw 'The release commit must belong to master.'
            }
          }
      - name: Install .NET and restore package cache
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore RM.AutoClicker.slnx --locked-mode --nologo -bl:artifacts/logs/restore.binlog
      - name: Build solution
        run: dotnet build RM.AutoClicker.slnx -c Release --no-restore --nologo -warnaserror -bl:artifacts/logs/build.binlog
      - name: Test without injecting input
        run: dotnet test RM.AutoClicker.slnx -c Release --no-build --no-restore --nologo --logger trx --results-directory artifacts/test-results
      - name: Test release scripts
        run: ./tests/scripts/Test-ReleaseScripts.ps1
      - name: Publish single-file executable
        id: publish
        run: |
          ./scripts/Publish.ps1
          $release = ./scripts/Get-Version.ps1
          $package = ./scripts/Test-ReleasePackage.ps1 -Directory "artifacts/release/$($release.Version)/win-x64"
          "package-sha256=$($package.SHA256)" >> $env:GITHUB_OUTPUT
      - name: Save release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/${{ steps.version.outputs.version }}/win-x64/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/logs/
            artifacts/test-results/
            artifacts/symbols/*.zip
          if-no-files-found: warn
          retention-days: 14
